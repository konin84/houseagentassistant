# ============================================================================
#  agency-service - development
# ============================================================================
#  Run with: cd agency-service && ../mvnw quarkus:dev -Ddebug=5009
#  Needs Keycloak: docker compose up -d keycloak
# ============================================================================

quarkus:
  http:
    port: 8085

  datasource:
    jdbc:
      url: jdbc:postgresql://localhost:5432/houseagent_agency

  # db/dev adds the two agencies the seeded Keycloak users belong to. Without them
  # admin-a is an administrator of an agency that does not exist, and opening their
  # own profile answers 404. Production runs db/migration alone.
  flyway:
    locations: db/migration,db/dev

    # Required by the line above, not a relaxation of standards. The dev seed is V900
    # so it always sorts last, which means every real migration added afterwards is
    # "out of order" by definition - V2 arriving after V900 has run is the normal case
    # here, not a mistake anybody made.
    #
    # Production runs db/migration alone, where versions only ever increase and this
    # setting is absent. Turning it on there would let a migration merged from an old
    # branch apply after the ones written since, against a schema its author never saw.
    out-of-order: true

  oidc:
    enabled: true
    auth-server-url: ${OIDC_AUTH_SERVER_URL:http://localhost:8180/realms/houseagent}
    client-id: ${OIDC_CLIENT_ID:houseagent-backend}
    credentials:
      secret: ${OIDC_CLIENT_SECRET:houseagent-dev-secret}
    application-type: service

  # The service account that creates users. A different client from the one above:
  # that one validates incoming tokens, this one acts on the platform's behalf.
  keycloak:
    admin-client:
      enabled: true
      server-url: ${KEYCLOAK_URL:http://localhost:8180}
      realm: ${KEYCLOAK_REALM:houseagent}
      client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:houseagent-admin}
      client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:houseagent-admin-dev-secret}
      grant-type: CLIENT_CREDENTIALS

  hibernate-orm:
    log:
      sql: true

  log:
    category:
      "com.digitalpartner.houseagent":
        level: DEBUG

  swagger-ui:
    always-include: true

kafka:
  bootstrap:
    servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
