# ============================================================================
#  lease-service - development
# ============================================================================
#  Run with: cd lease-service && ../mvnw quarkus:dev
#  Cross-service dev mode needs a broker: docker compose up -d redpanda
# ============================================================================

quarkus:
  http:
    port: 8082

  datasource:
    jdbc:
      url: jdbc:postgresql://localhost:5432/houseagent_lease

  # Real bearer-token authentication against the local Keycloak realm, the same way
  # every other environment works. Start it with:
  #
  #     docker compose up -d keycloak
  #
  # application-type: service means this is an API and not a website - a request with
  # no token gets 401 rather than a redirect to a login page.
  #
  # If Keycloak is not running the service still starts, and the X-Dev-* headers read
  # by DevIdentityAugmentor stand in. A real token always takes precedence over them.
  oidc:
    enabled: true
    auth-server-url: ${OIDC_AUTH_SERVER_URL:http://localhost:8180/realms/houseagent}
    client-id: ${OIDC_CLIENT_ID:houseagent-backend}
    credentials:
      secret: ${OIDC_CLIENT_SECRET:houseagent-dev-secret}
    application-type: service

  hibernate-orm:
    log:
      sql: true

  log:
    category:
      "com.digitalpartner.houseagent":
        level: DEBUG

  swagger-ui:
    always-include: true

kafka:
  bootstrap:
    servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
