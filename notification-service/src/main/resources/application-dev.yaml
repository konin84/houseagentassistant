# ============================================================================
#  notification-service - development
# ============================================================================
#  Run with: cd notification-service && ../mvnw quarkus:dev
#  Needs a broker and a mail catcher: docker compose up -d redpanda mailpit
# ============================================================================

quarkus:
  http:
    port: 8084

  datasource:
    jdbc:
      url: jdbc:postgresql://localhost:5432/houseagent_notification

  # Real bearer-token authentication against the local Keycloak realm, the same way
  # every other environment works. Start it with:
  #
  #     docker compose up -d keycloak
  #
  # application-type: service means this is an API and not a website - a request with
  # no token gets 401 rather than a redirect to a login page.
  #
  # If Keycloak is not running the service still starts, and the X-Dev-* headers read
  # by DevIdentityAugmentor stand in. A real token always takes precedence over them.
  oidc:
    enabled: true
    auth-server-url: ${OIDC_AUTH_SERVER_URL:http://localhost:8180/realms/houseagent}
    client-id: ${OIDC_CLIENT_ID:houseagent-backend}
    credentials:
      secret: ${OIDC_CLIENT_SECRET:houseagent-dev-secret}
    application-type: service

  # Mailpit catches everything at http://localhost:8025, so landlord
  # notifications can be read during development without a real SMTP account and
  # with no risk of emailing an actual person.
  mailer:
    from: ${MAIL_FROM:no-reply@houseagent.local}
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    start-tls: DISABLED
    login: DISABLED
    # Quarkus defaults this to true in dev mode, which quietly turns every send into
    # a log line - so the notification looks like it worked, Mailpit stays empty, and
    # the reason is nowhere near the symptom. Mailpit exists precisely so these can be
    # read, and it catches everything, so there is nothing to protect against here.
    mock: false

  hibernate-orm:
    log:
      sql: true

  log:
    category:
      "com.digitalpartner.houseagent":
        level: DEBUG

  swagger-ui:
    always-include: true

kafka:
  bootstrap:
    servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

app:
  notification:
    # Quicker than production, so a failed send can be seen retrying without
    # waiting five minutes.
    retry-interval: 30s
